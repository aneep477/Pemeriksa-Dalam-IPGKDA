<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pemeriksa Dalam (PD) - Muat Naik Bahan</title>
    <style>
        /* Gaya asas CSS untuk menjadikan portal nampak kemas */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status-message { margin-top: 20px; text-align: center; font-weight: bold; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>Muat Naik Bahan Pentaksiran (Pensyarah)</h2>
    <form id="uploadForm">
        <!-- Input Nama Pensyarah -->
        <div class="form-group">
            <label for="namaPensyarah">Nama Pensyarah:</label>
            <input type="text" id="namaPensyarah" required placeholder="Cth: Dr. Ahmad">
        </div>
        
        <!-- Input Kod Kursus -->
        <div class="form-group">
            <label for="kodKursus">Kod Kursus:</label>
            <input type="text" id="kodKursus" required placeholder="Cth: BMMB3013">
        </div>
        
        <!-- Input Pemilihan Fail -->
        <div class="form-group">
            <label for="failTugasan">Fail (PDF, DOCX, ZIP):</label>
            <input type="file" id="failTugasan" required>
        </div>
        
        <button type="submit" id="btnHantar">Muat Naik ke Drive PD</button>
    </form>
    
    <!-- Ruang paparan status pemprosesan -->
    <div id="status-message"></div>
</div>

<script>
    /**
     * Konfigurasi URL Web App Google Apps Script.
     * Gantikan URL ini dengan URL sebenar yang anda perolehi selepas Deploy di Apps Script.
     */
    const APPS_SCRIPT_URL = "MASUKKAN_URL_WEB_APP_ANDA_DI_SINI";

    /**
     * Mengendalikan acara "submit" pada borang.
     */
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        // 1. Menghalang borang daripada 'refresh' halaman.
        e.preventDefault();
        
        // 2. Mendapatkan rujukan (reference) kepada elemen-elemen HTML
        const namaPensyarah = document.getElementById('namaPensyarah').value;
        const kodKursus = document.getElementById('kodKursus').value;
        const failInput = document.getElementById('failTugasan').files[0];
        const statusDiv = document.getElementById('status-message');
        const btnHantar = document.getElementById('btnHantar');

        // 3. Kes Ralat (Edge Case): Memastikan fail telah dipilih
        if (!failInput) {
            statusDiv.innerHTML = '<span class="error">Sila pilih fail terlebih dahulu!</span>';
            return;
        }

        // 4. Mengemas kini status butang kepada mode 'loading'
        btnHantar.innerText = "Memuat Naik... Sila Tunggu";
        btnHantar.disabled = true;
        statusDiv.innerHTML = "Sedang memproses fail anda...";

        // 5. Menggunakan API FileReader untuk menukar fail fizikal kepada format Base64
        const reader = new FileReader();
        
        reader.onload = async () => {
            const base64String = reader.result; // Ini mengandungi data base64

            // 6. Menyusun objek data (Payload) yang akan dihantar ke Backend
            const payload = {
                namaPensyarah: namaPensyarah,
                kodKursus: kodKursus,
                namaFail: failInput.name,
                mimeType: failInput.type,
                failBase64: base64String
            };

            try {
                // 7. Menggunakan Fetch API untuk menghantar permintaan POST ke Apps Script
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                // 8. Menyemak respon logik yang diterima
                if (result.status === "success") {
                    statusDiv.innerHTML = `<span class="success">${result.mesej}</span>`;
                    document.getElementById('uploadForm').reset(); // Mengosongkan form
                } else {
                    statusDiv.innerHTML = `<span class="error">Ralat: ${result.mesej}</span>`;
                }
            } catch (error) {
                // 9. Pengendalian Ralat HTTP/Rangkaian
                statusDiv.innerHTML = `<span class="error">Ralat sambungan: ${error.message}</span>`;
            } finally {
                // 10. Memulihkan semula keadaan butang hantar
                btnHantar.innerText = "Muat Naik ke Drive PD";
                btnHantar.disabled = false;
            }
        };

        reader.onerror = () => {
            statusDiv.innerHTML = `<span class="error">Gagal membaca fail. Sila cuba lagi.</span>`;
            btnHantar.innerText = "Muat Naik ke Drive PD";
            btnHantar.disabled = false;
        };

        // Memulakan bacaan fail sebagai Data URL (Base64)
        reader.readAsDataURL(failInput);
    });
</script>
</body>
</html>
