<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papan Pemuka Semakan PD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --success-bg: #d1fae5;
            --success-text: #065f46;
            --warning-bg: #fef3c7;
            --warning-text: #92400e;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-primary); padding: 2rem 8%; transition: background-color 0.3s, color 0.3s; }
        
        .header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .logo { font-size: 1.8rem; font-weight: 700; color: var(--primary-color); }
        .theme-toggle { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-primary); }

        .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .search-box { flex: 1; min-width: 250px; padding: 0.8rem; border: 1px solid var(--border-color); border-radius: 8px; background: var(--surface-color); color: var(--text-primary); }
        .btn-refresh { background: var(--primary-color); color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background-color 0.3s; }
        .btn-refresh:hover { background: var(--primary-hover); }

        .table-container { background: var(--surface-color); border-radius: 12px; box-shadow: var(--shadow); overflow-x: auto; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 1.2rem 1.5rem; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(0,0,0,0.02); font-weight: 600; color: var(--text-primary); }
        body.dark-mode th { background-color: rgba(255,255,255,0.05); }
        
        .badge { padding: 0.4rem 0.8rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .badge-success { background-color: var(--success-bg); color: var(--success-text); }
        .badge-warning { background-color: var(--warning-bg); color: var(--warning-text); }
        
        .ulasan-box { line-height: 1.5; font-style: normal; }
        .pending-text { color: var(--text-secondary); font-style: italic; }
    </style>
</head>
<body>

<div class="header-container">
    <div>
        <div class="logo">Portal PD</div>
        <p style="color: var(--text-secondary);">Papan Pemuka Status Semakan Bahan Pentaksiran</p>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Tukar Mod Gelap">🌙</button>
</div>

<div class="controls">
    <input type="text" id="searchInput" class="search-box" placeholder="Cari Kod Kursus, Nama Kursus atau Pensyarah..." onkeyup="tapisData()">
    <button class="btn-refresh" onclick="muatTarikData()">Kemaskini Data</button>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Kod Kursus</th>
                <th>Nama Kursus</th>
                <th>Pensyarah</th>
                <th>Jabatan</th>
                <th>Status Semakan</th>
                <th>Ulasan PD</th>
            </tr>
        </thead>
        <tbody id="jadualData">
            <tr>
                <td colspan="6" style="text-align: center; color: var(--text-secondary);">Sedang memuatkan data...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjvVuuxBEdEN-6AwxbNj5wnq8xpuA4qQs7aSa7ntnh607vd3ixim6GPa9oZT9mUMCA/exec";
    let senaraiRekod = [];

    // Mod Gelap Logic
    const themeToggle = document.getElementById('themeToggle');
    if(localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.innerText = '☀️';
    }
    themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        themeToggle.innerText = isDark ? '☀️' : '🌙';
    });

    // Memuatkan Data dari Backend
    async function muatTarikData() {
        const tbody = document.getElementById('jadualData');
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-secondary);">Memohon data terbaharu pelayan...</td></tr>';

        try {
            const response = await fetch(APPS_SCRIPT_URL);
            const data = await response.json();

            if (data.status === "success" && data.rekod.length > 0) {
                senaraiRekod = data.rekod;
                paparkanJadual(senaraiRekod);
            } else {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Tiada rekod penyerahan ditemui.</td></tr>';
            }
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #ef4444;">Ralat memuatkan data: ${error.message}</td></tr>`;
        }
    }

    // Papar Data ke Jadual
    function paparkanJadual(dataArray) {
        const tbody = document.getElementById('jadualData');
        tbody.innerHTML = '';

        if(dataArray.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Carian tidak menjumpai padanan.</td></tr>';
            return;
        }

        dataArray.forEach(row => {
            const isDisahkan = row.status === "Disahkan PD";
            const badgeClass = isDisahkan ? "badge-success" : "badge-warning";
            const ulasanStyle = isDisahkan ? "ulasan-box" : "pending-text";

            tbody.innerHTML += `
                <tr>
                    <td><strong>${row.kodKursus}</strong></td>
                    <td>${row.namaKursus}</td>
                    <td>${row.namaPensyarah}</td>
                    <td>${row.jabatan}</td>
                    <td><span class="badge ${badgeClass}">${row.status}</span></td>
                    <td class="${ulasanStyle}">${row.ulasanPD}</td>
                </tr>
            `;
        });
    }

    // Tapis Carian
    function tapisData() {
        const kataKunci = document.getElementById('searchInput').value.toLowerCase();
        const hasilTapis = senaraiRekod.filter(r => 
            r.kodKursus.toLowerCase().includes(kataKunci) ||
            r.namaKursus.toLowerCase().includes(kataKunci) ||
            r.namaPensyarah.toLowerCase().includes(kataKunci) ||
            r.jabatan.toLowerCase().includes(kataKunci)
        );
        paparkanJadual(hasilTapis);
    }

    window.onload = muatTarikData;
</script>

</body>
</html>
